<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0D3B13"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0C778"/>
      <stop offset="100%" stop-color="#C8A951"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Islamic star pattern decorative ring -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="200" cy="180" r="102" fill="none" stroke="rgba(200, 169, 81, 0.4)" stroke-width="1"/>

  <!-- Silhouette Icon for Scholar / Amama / Cloak -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Turban / Amama -->
    <path d="M 160 115 C 160 90, 240 90, 240 115 C 255 120, 255 138, 235 142 C 225 145, 175 145, 165 142 C 145 138, 145 120, 160 115 Z"/>
    <!-- Head / Face Silhouette -->
    <ellipse cx="200" cy="155" rx="30" ry="34"/>
    <!-- Beard outline -->
    <path d="M 172 165 C 172 205, 228 205, 228 165 Z"/>
    <!-- Shoulders & Cloak (Aba) -->
    <path d="M 120 270 C 130 210, 165 195, 200 195 C 235 195, 270 210, 280 270 Z"/>
  </g>

  <!-- Informational banner -->
  <rect x="30" y="315" width="340" height="90" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(200, 169, 81, 0.3)" stroke-width="1"/>
  <text x="200" y="348" font-family="'Playfair Display', Georgia, serif" font-size="16" fill="#E0C778" font-weight="bold" text-anchor="middle">
    Ayatullah Syed Sibtain Abbas Rizvi
  </text>
  <text x="200" y="375" font-family="'Inter', sans-serif" font-size="12" fill="#D4E0D6" text-anchor="middle">
    Photo will display once uploaded to:
  </text>
  <text x="200" y="392" font-family="monospace" font-size="11" fill="#FFFFFF" text-anchor="middle">
    assets/images/scholar-photo.jpg
  </text>
</svg>

